name: Build and Push

# 打 v* 标签时：构建 linux/amd64 镜像 → 推送 GHCR（发布存档）→ 可选再推国内仓库（部署源）
# → 通过 SSH 滚动更新自有服务器上的容器。
#
# 镜像分发策略：
#   - 默认（未配 vars.TCR_IMAGE）：部署阶段从 GHCR / 加速源拉取（跨境，可能超时）。
#   - 配了 vars.TCR_IMAGE：同一份构建产物同时推 GHCR + 国内仓库；**部署阶段只拉国内仓库**，
#     跨境传输被限制在发布阶段，部署不再依赖 ghcr.io 的可达性。
#     拉取后按镜像 label 的 revision 校验内容 == 本次 commit，并默认拒绝降级覆盖。
#
# 与既有 docker-ghcr.yml 的分工：
#   - docker-ghcr.yml：push 到 main / 打 tag 时构建**多架构**镜像（main 推 latest/main/sha-*），
#     并在 PR 上做构建验证。
#   - 本工作流：**发布**流程。tag 时构建 amd64 单架构、推送与 tag 同名的镜像，并把
#     服务器上的容器滚动到该版本（含容器状态校验与可选健康检查）。
# 两者都会被 tag 触发（各构建一次）。若不想重复构建，可去掉 docker-ghcr.yml 的 tags
# 触发；本工作流不擅自改既有工作流。
on:
  push:
    tags:
      # main 线：v2026.10.24.1639
      - "v*"
      # dev 线：dev-v2026.10.24.1700（不会命中 upstream 的 binaries/docker-ghcr，二者只认 v*）
      - "dev-v*"
  # 手动补发/补部署用：只有在**默认分支**上存在本文件时，Actions 列表里才出现该按钮
  # （本仓默认分支 main 是上游镜像，本文件在 dev 上）。
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并部署的镜像 tag（留空则用 dev-<sha>；手动补发时填已有 tag，如 v2026.10.24.1639）"
        required: false
        default: ""

# 按**目标实例**串行：cn 与 global 互不阻塞，但同一实例不会被两个发布同时改。
# （以前按 git ref 分组，两个不同 tag 可能同时去改同一个 CN 容器。）
concurrency:
  group: build-and-push-${{ startsWith(github.ref_name, 'dev-v') && 'global' || 'cn' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/baicie/workbuddy2api-panel
  # 部署侧镜像源（可选）：配了 vars.TCR_IMAGE 就走国内仓库（腾讯云 TCR 个人版等），
  # 部署阶段不再依赖跨境访问 ghcr.io。留空则退回原来的 GHCR + 加速源逻辑。
  # 形如：ccr.ccs.tencentyun.com/<命名空间>/workbuddy2api-panel
  TCR_IMAGE: ${{ vars.TCR_IMAGE }}
  # TCR 的 registry 主机名（个人版为 ccr.ccs.tencentyun.com；换 harbor 等时改这里）
  TCR_REGISTRY: ${{ vars.TCR_REGISTRY || 'ccr.ccs.tencentyun.com' }}

jobs:
  docker:
    name: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      target: ${{ steps.vars.outputs.target }}
      deploy_dir: ${{ steps.vars.outputs.deploy_dir }}
      deploy_port: ${{ steps.vars.outputs.deploy_port }}
      deploy_name: ${{ steps.vars.outputs.deploy_name }}
      health_url: ${{ steps.vars.outputs.health_url }}
      revision: ${{ steps.vars.outputs.revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # 优先用手动输入（补发/补部署时指到已有 tag，避免再造 Release）；
          # 其次 tag 触发的 ref_name；最后回退到 dev-<sha>。
          if [[ -n "${INPUT_TAG:-}" ]]; then
            tag="${INPUT_TAG}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="dev-${GITHUB_SHA::7}"
          fi
          # 分支线 = realm 实例（一一对应）：
          #   main + v*      → 国内版实例：部署 CN 账号（copilot.tencent.com / codebuddy.cn）
          #   dev  + dev-v*  → 国际版实例：实验性质，部署 Global 账号（www.workbuddy.ai）
          # 两条线各有独立目录 / 宿主端口 / 容器名 / 账号池 / api_key，互不影响。
          # 注意：这里必须用字面量 ~（不要写 $HOME）——本步骤跑在 runner 上，
          # $HOME 会被展开成 /home/runner/...，而目标路径是**服务器**上的家目录；
          # 远端脚本再把 ~ 展开成服务器用户的 $HOME。
          if [[ "${tag}" == dev-v* ]]; then
            release="dev"
            target="global"
            deploy_dir="~/workbuddy2api-global"
            deploy_port="7864"
            deploy_name="workbuddy2api-global"
          else
            release="main"
            target="cn"
            deploy_dir="~/workbuddy2api"
            deploy_port="7863"
            deploy_name="workbuddy2api"
          fi
          # 镜像内容校验用的 revision：镜像 label 记的是**构建时的 commit**。
          # tag 触发时就是 GITHUB_SHA；手动补部署旧 tag 时必须取该 tag 指向的 commit，
          # 否则用当前 HEAD 去比对必然不匹配（补部署会被自己的校验拦住）。
          revision="${GITHUB_SHA}"
          if [[ -n "${INPUT_TAG:-}" ]]; then
            # 手动补部署时 checkout 的是分支，本地没有该 tag，先按需拉一次。
            git fetch -q --depth=1 origin "refs/tags/${tag}:refs/tags/${tag}" 2>/dev/null || true
            if git rev-parse -q --verify "refs/tags/${tag}^{commit}" >/dev/null 2>&1; then
              revision="$(git rev-parse "refs/tags/${tag}^{commit}")"
            fi
          fi
          {
            echo "tag=${tag}"
            echo "revision=${revision}"
            echo "image=${IMAGE}"
            echo "release=${release}"
            echo "target=${target}"
            echo "deploy_dir=${deploy_dir}"
            echo "deploy_port=${deploy_port}"
            echo "deploy_name=${deploy_name}"
            echo "health_url=http://127.0.0.1:${deploy_port}/panel/"
          } >> "$GITHUB_OUTPUT"
          echo "building ${IMAGE}:${tag}（${release} 线 → ${target} 实例：${deploy_dir} :${deploy_port} / ${deploy_name}）"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 可选：把同一份镜像再推到国内仓库（部署侧从它拉，见 deploy job）。
      - name: Login to TCR
        if: env.TCR_IMAGE != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 必须注入面板版本号：Dockerfile 是 `ARG APP_VERSION=dev` 兜底，不传 build-args
          # 时运行中的 appVersion 就是 "dev"；updater 里 parseVersion("dev") 失败会让
          # `UpdateAvailable = !currentOK || …` 恒为 true，左上角「有更新」徽章永远亮着
          # （2026-10-27 排查：真实部署 v2026.10.27.403 仍显示有更新）。传 tag 后徽章只在
          # 「上游确实发了比当前部署更新的 Release」时才亮。
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.tag }}
          # 与需求一致：只出 amd64。要 arm64 时改成 "linux/amd64,linux/arm64"，
          # 并加一步 docker/setup-qemu-action@v3。
          platforms: linux/amd64
          # 两处 tag：GHCR 作为发布存档；TCR（若配置）作为国内部署源。
          # 同一份构建产物推两个仓库，跨境传输发生在发布阶段，部署阶段只走国内。
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.TCR_IMAGE != '' && format('{0}:{1}', env.TCR_IMAGE, steps.vars.outputs.tag) || '' }}
          labels: |
            org.opencontainers.image.title=workbuddy2api-panel
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=build-and-push
          cache-to: type=gha,mode=max,scope=build-and-push
          # 关闭 provenance：避免 ghcr 页面出现 unknown/unknown 架构条目（与 docker-ghcr.yml 同口径）。
          provenance: false

      - name: Verify pushed tag
        run: |
          # 双保险：确认刚推的 tag 真在 registry 上，防止"推送失败但 CI 绿"。
          docker buildx imagetools inspect "${IMAGE}:${{ steps.vars.outputs.tag }}"
          if [[ -n "${TCR_IMAGE}" ]]; then
            docker buildx imagetools inspect "${TCR_IMAGE}:${{ steps.vars.outputs.tag }}"
          fi

  deploy:
    name: deploy-${{ needs.docker.outputs.target }}
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOY_TAG: ${{ needs.docker.outputs.tag }}
      IMAGE_REF: ${{ needs.docker.outputs.image }}
      # 镜像 digest：按 digest 拉取（内容寻址），可安全使用第三方加速源。
      IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
      # 国内云主机直连 ghcr.io 实测约 21KB/s（35MB 镜像需 ~28 分钟），默认先走加速源。
      GHCR_MIRRORS: ${{ vars.GHCR_MIRRORS || 'ghcr.nju.edu.cn' }}
      # 目标机默认值来自 docker_targets_82.156.234.84.csv（host/port/user）。
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '82.156.234.84' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      # 该发布线对应的实例档案（由 Resolve tag 决定）：
      #   main → CN 实例；dev → Global 实例。
      DEPLOY_DIR: ${{ needs.docker.outputs.deploy_dir }}
      CONTAINER: ${{ needs.docker.outputs.deploy_name }}
      HOST_PORT: ${{ needs.docker.outputs.deploy_port }}
      HEALTH_URL: ${{ needs.docker.outputs.health_url }}
      TARGET_NAME: ${{ needs.docker.outputs.target }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
      # 部署侧镜像源（可选）：配了 TCR_IMAGE 就**只**从国内仓库拉，不再跨境访问 GHCR。
      # 拉取后用镜像 label 的 revision 校验内容 == 本次构建的 commit，防止串版本。
      TCR_IMAGE: ${{ vars.TCR_IMAGE }}
      TCR_REGISTRY: ${{ vars.TCR_REGISTRY || 'ccr.ccs.tencentyun.com' }}
      TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
      TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
      # 镜像 label 里的 revision = 该 tag 的构建 commit（补部署旧 tag 时不能用当前 HEAD）
      EXPECTED_REVISION: ${{ needs.docker.outputs.revision || github.sha }}
      # 允许回滚到更旧 tag（默认拦截"旧版本覆盖新版本"）。回滚时置 true。
      ALLOW_DOWNGRADE: ${{ vars.ALLOW_DOWNGRADE || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy credentials
        id: cred
        run: |
          set -euo pipefail
          if [[ -n "${SSH_KEY:-}" ]]; then
            method=key
          elif [[ -n "${SSH_PASSWORD:-}" ]]; then
            method=password
          else
            echo "::error::缺少部署凭据：请在仓库 Secrets 配置 DEPLOY_SSH_KEY（推荐）或 DEPLOY_SSH_PASSWORD"
            exit 1
          fi
          echo "method=${method}" >> "$GITHUB_OUTPUT"
          echo "deploy target: ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PORT} dir=${DEPLOY_DIR} container=${CONTAINER}"

      - name: Install SSH client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client sshpass

      - name: Upload deploy compose
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [[ "${{ steps.cred.outputs.method }}" == "key" ]]; then
            printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes)
          else
            printf '%s' "${SSH_PASSWORD}" > ~/.ssh/pass
            chmod 600 ~/.ssh/pass
            SSH=(sshpass -f ~/.ssh/pass ssh)
          fi
          SSH+=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${DEPLOY_PORT}")

          # 服务器不需要 git 仓库：目录按需创建，compose 文件用 base64 单次传过去
          # （避开 rsync 与 sshpass 的交互问题，也不依赖 scp 的路径展开行为）。
          COMPOSE_B64="$(base64 < deploy/docker-compose.deploy.yml | tr -d '\n')"
          "${SSH[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' -- "${DEPLOY_DIR}" "${COMPOSE_B64}" <<'REMOTE'
          set -euo pipefail
          RAW_DIR="$1"; B64="$2"
          # 远端展开 ~ 与 $HOME（这两个写法在传参时不会二次展开，必须在远端处理）。
          DIR="${RAW_DIR/#\$HOME/$HOME}"; DIR="${DIR/#\~/$HOME}"
          COMPOSE_PATH="${DIR}/docker-compose.deploy.yml"
          mkdir -p "$DIR"
          printf '%s' "$B64" | base64 -d > "$COMPOSE_PATH"
          chmod 644 "$COMPOSE_PATH"
          echo "compose 已就绪: $COMPOSE_PATH"
          REMOTE

      - name: Rolling update container
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [[ "${{ steps.cred.outputs.method }}" == "key" ]]; then
            printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes)
          else
            printf '%s' "${SSH_PASSWORD}" > ~/.ssh/pass
            chmod 600 ~/.ssh/pass
            SSH=(sshpass -f ~/.ssh/pass ssh)
          fi
          SSH+=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${DEPLOY_PORT}")

          # 远端脚本从 stdin 读、参数用位置参数传（不拼进命令串，避免注入）。
          "${SSH[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' -- \
            "${IMAGE_REF}" "${DEPLOY_TAG}" "${IMAGE_DIGEST}" "${CONTAINER}" "${DEPLOY_DIR}" "${HEALTH_URL}" "${GHCR_MIRRORS}" "${HOST_PORT}" \
            "${TCR_IMAGE}" "${TCR_REGISTRY}" "${TCR_USERNAME}" "${TCR_PASSWORD}" "${EXPECTED_REVISION}" "${ALLOW_DOWNGRADE}" <<'REMOTE'
          set -euo pipefail
          IMAGE="$1"; TAG="$2"; DIGEST="$3"; CONTAINER="$4"; RAW_DIR="$5"; HEALTH="$6"; MIRRORS="$7"; HOST_PORT="$8"
          TCR="$9"; TCR_REGISTRY="${10}"; TCR_USER="${11}"; TCR_PASS="${12}"; WANT_REV="${13}"; ALLOW_DOWN="${14}"
          DIR="${RAW_DIR/#\$HOME/$HOME}"; DIR="${DIR/#\~/$HOME}"
          CANONICAL="${IMAGE}:${TAG}"
          REPO_PATH="${IMAGE#ghcr.io/}"

          # docker 访问权限：云主机常见「用户在 sudo 组、但不在 docker 组」，
          # 直连 socket 会 permission denied。这里自动回退到 sudo，避免部署直接失败。
          if docker info >/dev/null 2>&1; then
            DOCKER=(docker); echo "==> docker: 直连（当前用户已在 docker 组）"
          elif sudo -n true >/dev/null 2>&1; then
            DOCKER=(sudo -n docker); echo "==> docker: 经 sudo（当前用户不在 docker 组）"
          else
            echo "::error::当前用户无法访问 docker，且无免密 sudo。请在服务器执行：sudo usermod -aG docker <user> 后重新登录"
            exit 1
          fi

          # compose 依赖 IMAGE_TAG 等环境变量；走 sudo 时 sudo 会清空环境，
          # 所以用 `env` 显式把它们传给命令。
          if [[ "${DOCKER[0]}" == "sudo" ]]; then
            RUN=(sudo -n env "IMAGE_REPO=${IMAGE}" "IMAGE_TAG=${TAG}" "CONTAINER_NAME=${CONTAINER}" "HOST_PORT=${HOST_PORT}" "COMPOSE_PROJECT_NAME=${CONTAINER}" docker)
          else
            RUN=(env "IMAGE_REPO=${IMAGE}" "IMAGE_TAG=${TAG}" "CONTAINER_NAME=${CONTAINER}" "HOST_PORT=${HOST_PORT}" "COMPOSE_PROJECT_NAME=${CONTAINER}" docker)
          fi

          # 国内云主机直连 ghcr.io 实测约 21.5KB/s（35MB 镜像需近半小时），故镜像源优先。
          # **按 digest 拉取**：内容寻址，加速源无法替换镜像内容（哈希必须一致），
          # 这也让"用第三方加速"不再是一个纯信任问题。
          #
          # 配了 TCR_IMAGE 时：**只从国内仓库拉**，不再跨境访问 GHCR —— 这是解决
          # 「所有镜像源都拉取失败」的正解（把跨境传输挪到发布阶段）。
          candidates=()
          if [[ -n "${TCR}" ]]; then
            if [[ -n "${TCR_USER}" ]]; then
              # 私有仓库：在服务器上登录（凭据经 SSH stdin 传入，不落磁盘、不进日志）。
              printf '%s' "${TCR_PASS}" | "${DOCKER[@]}" login "${TCR_REGISTRY}" -u "${TCR_USER}" --password-stdin >/dev/null
              echo "==> 已登录 ${TCR_REGISTRY}"
            fi
            candidates+=("${TCR}:${TAG}")
          else
            _add_mirrors() {
              local suffix="$1"
              [[ -z "${MIRRORS}" ]] && return 0
              # 逗号或空白分隔都接受（GHCR_MIRRORS 写 "a.com b.com" 或 "a.com,b.com" 均可）
              for m in $(printf '%s' "${MIRRORS}" | tr ',;' '  '); do
                [[ -n "$m" ]] && candidates+=("${m}/${REPO_PATH}${suffix}")
              done
            }
            if [[ -n "${DIGEST}" ]]; then
              _add_mirrors "@${DIGEST}"
              candidates+=("${IMAGE}@${DIGEST}")
            else
              _add_mirrors ":${TAG}"
              candidates+=("${CANONICAL}")
            fi
          fi

          PULLED=""
          for ref in "${candidates[@]}"; do
            echo "==> docker pull ${ref}"
            if timeout 240 "${RUN[@]}" pull "${ref}"; then PULLED="${ref}"; break; fi
            echo "    （该源失败/超时，尝试下一个）"
          done
          if [[ -z "${PULLED}" ]]; then
            echo "::error::所有镜像源都拉取失败：${candidates[*]}"
            exit 1
          fi
          "${RUN[@]}" tag "${PULLED}" "${CANONICAL}"
          echo "==> 镜像就绪：${CANONICAL}（来源 ${PULLED}）"

          # 内容校验：跨 registry 后 manifest digest 不保证相同，用构建期写入的
          # revision label 比对最可靠——保证拉到的确实是本次这个 commit 的产物。
          got_rev="$("${RUN[@]}" inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${CANONICAL}" 2>/dev/null || echo '')"
          if [[ -n "${WANT_REV}" && "${got_rev}" != "${WANT_REV}" ]]; then
            echo "::error::镜像内容校验失败：revision=${got_rev:-<空>}，期望 ${WANT_REV}（拉到的不是本次构建产物）"
            exit 1
          fi
          echo "==> 内容校验通过：revision=${got_rev}"

          # 降级保护：默认不允许用更旧的 tag 覆盖线上更新的版本（并发/补发时容易发生）。
          # 版本标签形如 vYYYY.M.D.HMM，按定长数字比较；非该格式（如 dev-<sha>）跳过。
          _vkey() {
            local v="${1#v}"
            case "$v" in
              [0-9]*.[0-9]*.[0-9]*.[0-9]*) printf '%s' "$v" | awk -F. '{printf "%04d%03d%03d%04d", $1, $2, $3, $4}' ;;
              *) printf '' ;;
            esac
          }
          cur_img="$("${RUN[@]}" inspect -f '{{.Config.Image}}' "${CONTAINER}" 2>/dev/null || echo '')"
          cur_tag="${cur_img##*:}"
          new_key="$(_vkey "${TAG}")"; cur_key="$(_vkey "${cur_tag}")"
          if [[ -n "${new_key}" && -n "${cur_key}" && "${new_key}" < "${cur_key}" && "${ALLOW_DOWN}" != "true" ]]; then
            echo "::error::拒绝降级：线上运行 ${cur_tag}，本次要部署的 ${TAG} 更旧。"
            echo "  确需回滚请把仓库变量 ALLOW_DOWNGRADE 设为 true 后重跑本 job。"
            exit 1
          fi

          cd "${DIR}"
          # config.json 必须先存在：缺失时 Docker 会把 bind mount 建成目录，容器随即
          # 启动失败且原因很隐蔽。这里显式失败并给出可操作提示。
          if [[ ! -f config.json ]]; then
            echo "::error::${DIR}/config.json 不存在。首次部署请在该目录执行："
            echo "  cp <repo>/config.example.json ${DIR}/config.json   # 再按需填 api_key"
            exit 1
          fi

          echo "==> 滚动更新（${DIR}）"
          if ! "${RUN[@]}" compose version >/dev/null 2>&1; then
            echo "::error::服务器缺少 docker compose 插件（需要 docker compose 或 docker-compose）"
            exit 1
          fi
          # --pull never：镜像已在上一步按 digest 拉好并改成规范名，这里不要再回源
          "${RUN[@]}" compose -f docker-compose.deploy.yml up -d --pull never --remove-orphans

          echo "==> 容器状态"
          "${RUN[@]}" ps --filter "name=${CONTAINER}" --format 'table {{.Names}}	{{.Image}}	{{.Status}}	{{.Ports}}'

          # 容器必须 running，否则本次发布判失败（不允许 CI 绿着但服务没起来）。
          state="$("${RUN[@]}" inspect -f '{{.State.Status}}' "${CONTAINER}" 2>/dev/null || echo missing)"
          if [[ "${state}" != "running" ]]; then
            echo "::error::容器 ${CONTAINER} 状态=${state}，发布失败"
            "${RUN[@]}" logs --tail 80 "${CONTAINER}" 2>&1 || true
            exit 1
          fi

          # 可选健康检查：/healthz 在「池里没有可用账号」时按设计返回 503，故默认不查它；
          # 需要时把 DEPLOY_HEALTH_URL 设为 http://127.0.0.1:7863/panel/ 之类的地址。
          if [[ -n "${HEALTH}" ]]; then
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${HEALTH}" || echo 000)"
            echo "==> 健康检查 ${HEALTH} -> HTTP ${code}"
            if [[ "${code}" != "200" ]]; then
              echo "::error::健康检查未通过（HTTP ${code}）"
              exit 1
            fi
          fi

          "${RUN[@]}" image prune -f >/dev/null 2>&1 || true
          echo "部署完成：${IMAGE}:${TAG}"
          REMOTE

      - name: Cleanup credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/pass
